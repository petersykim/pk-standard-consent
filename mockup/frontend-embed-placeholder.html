<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standard Consent — Blocked Embed Placeholder (frontend)</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/consent.css">
<style>
  body {
    font-family: var(--font-sans);
    background: hsl(var(--pk-bg));
    padding: 48px 24px;
  }
  .demo-page {
    max-width: 640px;
    margin: 0 auto;
  }
  .demo-page h1 {
    font-size: var(--fs-xl);
    color: hsl(var(--pk-text));
    margin-bottom: var(--sp-6);
  }
</style>
</head>
<body class="pk-root">

<div class="demo-page">
  <h1>Article page</h1>

  <div class="pk-sc-embed" style="--pk-sc-ratio: 16/9;">
    <div class="pk-sc-embed__body">
      <svg class="pk-sc-embed__icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <p class="pk-sc-embed__message">
        This embedded content is blocked until you allow marketing cookies.
      </p>
      <div class="pk-sc-embed__actions">
        <button class="pk-sc-btn pk-sc-btn--primary" type="button">
          Allow marketing cookies &amp; load
        </button>
        <button class="pk-sc-btn pk-sc-btn--ghost" type="button">
          Manage preferences
        </button>
      </div>
    </div>
  </div>

</div>

</body>
</html>
